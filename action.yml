name: Release Autopilot
description: Semantic releases with notes written for the people who use the project.
author: roquerodrigo

branding:
  icon: feather
  color: purple

inputs:
  token:
    description: >-
      Token with contents and pull-requests write access. The default GITHUB_TOKEN
      works, but its pushes do not trigger workflows, so a release pull request
      opened with it runs no checks.
    required: true
    default: ${{ github.token }}
  anthropic-api-key:
    description: Key for the Claude API.
    required: true
  repository:
    description: Repository to release, as owner/name.
    required: true
    default: ${{ github.repository }}
  dry-run:
    description: Plan the release and write its notes, printing what would change without changing anything.
    required: false
    default: "false"
  preview-previous-tag:
    description: With preview-release-tag, writes the notes of a past release to the job summary and changes nothing.
    required: false
    default: ""
  preview-release-tag:
    description: Tag of the past release to preview.
    required: false
    default: ""

outputs:
  released:
    description: "\"true\" when this run published a release."
  tag:
    description: Tag published by this run, if any.
  version:
    description: Version published by this run, if any.
  pull-request:
    description: URL of the open release pull request, if any.

runs:
  using: node24
  main: dist/index.cjs
