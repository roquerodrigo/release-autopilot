name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Release
        id: release
        uses: ./ # zizmor: ignore[self-repository]
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}

      # `v1` follows every 1.x release and the first 2.0.0 creates `v2`, leaving `v1` on
      # the last 1.x. `latest` follows every release, across major versions.
      - name: Move the version tags
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)"
          for moving_tag in "${TAG%%.*}" latest; do
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$moving_tag" --silent 2>/dev/null; then
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$moving_tag" \
                -f sha="$sha" -F force=true --silent
            else
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref="refs/tags/$moving_tag" -f sha="$sha" --silent
            fi
            echo "$moving_tag now points at $TAG ($sha)."
          done

  # Trusted publishing: npm takes the OIDC token of this workflow, self-release.yml, in
  # the npm environment, so no registry token is stored here.
  publish:
    name: npm
    needs: release
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: read
      id-token: write
    uses: roquerodrigo/workflows/.github/workflows/publish-npm.yml@main
    with:
      ref: ${{ needs.release.outputs.tag }}
