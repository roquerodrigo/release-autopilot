name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    uses: roquerodrigo/workflows/.github/workflows/node-lint.yml@main

  tests:
    permissions:
      contents: read
    uses: roquerodrigo/workflows/.github/workflows/node-test.yml@main

  # Only a release pull request carries the bundle, which Release bundle commits to it.
  # Elsewhere the job is skipped, which a required check takes as passing.
  bundle:
    name: Bundle is current
    if: github.head_ref == 'release/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: roquerodrigo/workflows/actions/setup-node@main
        with:
          node-version: "24"

      - name: Rebuild the bundle
        run: npm run build

      - name: Compare with the committed bundle
        run: git diff --exit-code -- dist

  package:
    permissions:
      contents: read
    uses: roquerodrigo/workflows/.github/workflows/node-build.yml@main
    with:
      script: build:package

  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint the workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          fail-on-error: true

  zizmor:
    name: Zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Audit the workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx --from 'zizmor>=1,<2' zizmor --persona regular --min-severity low .
