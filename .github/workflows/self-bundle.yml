name: Release bundle

# The action runs the bundle committed at its tag, and only a release pull request
# carries it to main: other pull requests never touch dist/. The push uses
# RELEASE_TOKEN so that CI runs again on the commit that carries the bundle.

on:
  pull_request:
    branches: [main]

concurrency:
  group: release-bundle-${{ github.head_ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  bundle:
    name: Bundle the release
    if: >-
      github.head_ref == 'release/main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: Set up Node
        uses: roquerodrigo/workflows/actions/setup-node@main
        with:
          node-version: "24"

      - name: Build the bundle
        run: npm run build

      - name: Commit the bundle
        env:
          BRANCH: ${{ github.head_ref }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if git diff --quiet -- dist; then
            echo "The release already carries its bundle."
            exit 0
          fi
          owner="$(GH_TOKEN="$RELEASE_TOKEN" gh api user)"
          git config user.name "$(jq --raw-output '.name // .login' <<< "$owner")"
          git config user.email "$(jq --raw-output '"\(.id)+\(.login)@users.noreply.github.com"' <<< "$owner")"
          git add dist
          git commit --message "build: bundle the release"
          git push "https://x-access-token:${RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${BRANCH}"
